[package]
name = "deck-core"
version = "0.1.0"
edition = "2021"

[dependencies]
aes = "0.8"
alacritty_terminal = "0.26"
anyhow = "1"
argon2 = "0.5"
cbc = "0.1"
des = "0.8"
encoding_rs = "0.8"
hmac = "0.12"
md-5 = "0.10"
pageant = { version = "0.2", features = ["wmmessage"] }
ring = "0.17"
russh-sftp = "3"
# ring instead of the default aws-lc-rs, which needs NASM to build on Windows
russh = { version = "0.65", default-features = false, features = ["des", "flate2", "ring", "rsa"] }
sha1 = "0.10"
sha2 = "0.10"
socket2 = "0.6"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-serial = "5.4"
zeroize = "1"

[dev-dependencies]
rand = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
